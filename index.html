<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163a33">
  <meta name="description" content="A local-first food expiry tracker with sample produce-sharing and pantry-coordination boards for a FoodCycle NC demo.">
  <title>FoodCycle NC — use it while it’s good</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
  THESIS: An urgency-first food ledger makes the next good use of every item easier to see; it refuses a generic all-purpose community dashboard.
  OWN-WORLD: A cool-white field log, evergreen wayfinding, citrus action marks, and tomato-red expiry signals make a paper pantry register feel precise on screen.
  STORY: See what needs attention, use or share it, then try clearly labeled local-demo pickup and pantry-request flows.
  FIRST VIEWPORT: A fixed evergreen rail frames a dated greeting, compact inventory facts, the add-food control, and a soonest-first expiry register.
  FORM: Rank-one cooperative field-service ledger, staged as an urgency-sorted working register; seed tooling was unavailable in this Node-free environment.
  -->
  <a class="skip-link" href="#main-content">Skip to the food list</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="FoodCycle navigation">
      <a class="brand" href="#inventory" data-nav="inventory" aria-label="FoodCycle NC home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none"><path d="M18 29V15m0 7c-6 0-10-4-10-10 6 0 10 4 10 10Zm0-4c0-6 4-10 10-10 0 6-4 10-10 10Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 29h22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-copy"><strong>foodcycle</strong><small>NORTH CAROLINA</small></span>
      </a>

      <p class="nav-heading">YOUR FOOD</p>
      <nav class="main-nav" aria-label="Main">
        <button class="nav-item is-active" type="button" data-nav="inventory" aria-current="page">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.5V21" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span>Expiry tracker</span>
        </button>
        <button class="nav-item" type="button" data-nav="sharing">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M12 20s-8-4.5-8-11a4.4 4.4 0 0 1 8-2.5A4.4 4.4 0 0 1 20 9c0 6.5-8 11-8 11Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 12h8m-4-4v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>Share board</span><span class="beta-mark">BETA</span>
        </button>
        <button class="nav-item" type="button" data-nav="pantries">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 20V8l8-5 8 5v12H4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 20v-7h8v7M8 9h.01M12 9h.01M16 9h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Pantry network</span><span class="beta-mark">BETA</span>
        </button>
        <button class="nav-item" type="button" data-nav="impact">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 19V9m5 10V5m6 14v-7m5 7V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Impact &amp; hours</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="demo-note">
          <span class="demo-dot" aria-hidden="true"></span>
          <div><strong>Sample mode</strong><p>Example entries only.<br>Nothing here is live.</p></div>
        </div>
        <p class="local-note">Saved in this browser<br>on this device.</p>
      </div>
    </aside>

    <main class="main-layout" id="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>FOODCYCLE NC</span><span aria-hidden="true">/</span><span id="crumb-label">YOUR FOOD</span></div>
        <div class="topbar-right">
          <span class="sample-pill"><span aria-hidden="true"></span> SAMPLE DATA</span>
          <span class="today-date" id="today-date"></span>
        </div>
      </header>
      <div id="app"></div>
      <footer class="main-footer">
        <span>FoodCycle NC · Local demo</span>
        <button type="button" class="text-button" data-action="reset-demo">Reset sample data</button>
      </footer>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
